<html>
<body class="login-page" style="overflow-y: hidden;">
    <!-- Main Navigation -->
    <header>

        <!-- Navbar -->
        <form id="form" method="post" action="#">
            <!-- Intro Section -->
            <section class="view intro-2">
                <div class="mask rgba-stylish-strong h-100 d-flex justify-content-center align-items-center">
                    <div class="container">
                        <div class="row">
                            <div class="col-xl-5 col-lg-6 col-md-10 col-sm-12 mx-auto mt-1">

                                <!-- Form with header -->
                                <div   class="card wow fadeIn" data-wow-delay="0.3s">

                                    <div *ngIf="!otpSent" [formGroup]="emailForm" class="card-body">

                                        <!-- Header -->
                                        <div class="form-header peach-gradient" style="text-align: center;">

                                            <h3 class="font-weight-500 my-2 py-1" id="forgot_pwd_lb">FORGOT PASSWORD</h3>
                                        </div>

                                        <!-- Body -->

                                        <div class="md-form" id="email_lb">
                                            <i class="fas fa-envelope prefix white-text"></i>
                                            <input type="email" id="email" formControlName="email" name="email" class="form-control" required="">
                                            <label for="email" value="email">Email Address*</label>
                                        </div>
                                        <div *ngIf="emailForm.get('email').touched && emailForm.get('email').invalid" class="text-danger">
                                            <div *ngIf="emailForm.get('email').errors?.required">Email is required.</div>
                                            <div *ngIf="emailForm.get('email').errors?.email">Please enter a valid email address.</div>
                                        </div>


                                        <div class="text-center mt-5">
                                            <button type="submit" class="btn peach-gradient waves-effect waves-light" (click)="sendRequest()" >
                                                Send Request
                                            </button>
                                            <button type="button" class="btn peach-gradient waves-effect waves-light" (click)="goBack()">
                                                Go Back
                                            </button>
                                            <hr class="mt-4">
                                        </div>

                                    </div>

                                    <div *ngIf="otpSent" [formGroup]="resetForm" class="card-body">

                                        <!-- Header -->
                                        <div class="form-header peach-gradient" style="text-align: center;">
                                            <h3 class="font-weight-500 my-2 py-1" id="reset_pwd_lb">ENTER CODE &amp; NEW PASSWORD</h3>
                                        </div>

                                        <div class="md-form" id="otp_lb">
                                            <i class="fas fa-key prefix white-text"></i>
                                            <input type="text" id="reset_otp" formControlName="otp" name="otp" class="form-control" required="">
                                            <label for="reset_otp">Verification Code</label>
                                        </div>
                                        <div *ngIf="resetForm.get('otp')?.touched && resetForm.get('otp')?.invalid" class="text-danger">
                                            Verification code is required.
                                        </div>

                                        <div class="md-form" id="new_pwd_lb">
                                            <i class="fas fa-lock prefix white-text"></i>
                                            <input type="password" id="reset_new_pwd" formControlName="password" name="password" class="form-control" required="">
                                            <label for="reset_new_pwd">New Password</label>
                                        </div>
                                        <div *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.invalid" class="text-danger">
                                            New password is required.
                                        </div>

                                        <div class="md-form" id="confirm_new_pwd_lb">
                                            <i class="fas fa-lock prefix white-text"></i>
                                            <input type="password" id="reset_confirm_pwd" formControlName="cpassword" name="cpassword" class="form-control" required="">
                                            <label for="reset_confirm_pwd">Confirm New Password</label>
                                        </div>
                                        <div *ngIf="resetForm.get('cpassword')?.touched && resetForm.get('cpassword')?.invalid" class="text-danger">
                                            Please confirm your new password.
                                        </div>

                                        <div class="text-center mt-5">
                                            <button type="submit" class="btn peach-gradient waves-effect waves-light" (click)="resetPassword()">
                                                Reset Password
                                            </button>
                                            <button type="button" class="btn peach-gradient waves-effect waves-light" (click)="goBack()">
                                                Go Back
                                            </button>
                                            <hr class="mt-4">
                                        </div>

                                    </div>

                                </div>
                                <!-- Form with header -->

                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </form>
    </header>
    <!-- Main Navigation -->

</body>

<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-clip-rotate-multiple">
    <p style="font-size: 20px; color: white">Loading...</p>
</ngx-spinner>
</html>
