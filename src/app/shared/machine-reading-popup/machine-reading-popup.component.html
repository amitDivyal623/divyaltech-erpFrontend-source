<div class="modal-content">
    <!-- Header -->
    <div class="modal-header mdb-color" style="height: 3rem;">
        <p class="heading lead font-weight-bold" style="color: white;">{{machineTitle}}</p>
        <button type="button" class="close" (click)="modal.dismiss()">
            <span aria-hidden="true" class="white-text">&times;</span>
        </button>
    </div>

    <!-- Body -->
    <form [formGroup]="addMachineReading" id="addMachineReading" name="addMachineReading">
        <div class="modal-body" #container>
            <div class="col-lg-12 col-md-12">
                <div class="row">
                    <input type="hidden" formControlName="reading" id="readingID">
                    <div class="col-lg-6 col-md-12 px-2">
                        <div class="md-form md-outline">
                            <input placeholder="Select date" id="'myDate" formControlName="date" name="date"
                                [minDate]="minDate" [maxDate]="maxDate" readonly ngbDatepicker #dateadd="ngbDatepicker"
                                (click)="dateadd.toggle()" type="text" id="date" class="form-control datepicker">
                            <label for="date" class="active">Date *</label>
                         </div>
                    </div>
                    <div class="col-lg-6 col-md-12 md-form md-outline px-2">
                        <select class="form-control field-ht colorful-select" formControlName="projectName"
                            id="projectName" name="project_id">
                            <option value="" selected="true">Select Project Name</option>
                            <option *ngFor="let projectlist of respProject" value={{projectlist.projectId}}>
                                {{projectlist.projectName}} / {{projectlist.projectType}}
                            </option>
                        </select>
                        <label class="ml-2 active">Project Name *</label>

                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 col-md-12 px-2">
                        <div class=" md-form md-outline">
                            <input (input)="calculateTotalRun()" formControlName="startReading" min="0" type="number"
                                id="reading_start" name="reading_start" class="form-control" 
                                [ngClass]="{ 'is-invalid': (submitted && addMachineReading.controls['startReading'].errors ) || (addMachineReading.controls['startReading'].errors && addMachineReading.controls['startReading'].touched)}">
                            <label for="reading_start" class="Active">Reading On Start *</label>
                            <code
                                *ngIf="(submitted && addMachineReading.controls['startReading'].errors ) || (addMachineReading.controls['startReading'].touched && addMachineReading.controls['startReading'].invalid)">Reading On Start is required</code>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-12 px-2">
                        <div class=" md-form md-outline">
                            <input (input)="calculateTotalRun()" formControlName="stopReading" min="0" type="number"
                                id="reading_stop" name="reading_stop" class="form-control" 
                                >
                            <label for="reading_stop" class="Active">Reading On Stop *</label>

                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 col-md-12 px-2">
                        <div class=" md-form md-outline">
                            <input formControlName="total_run" min="0" type="number" id="total_run" name="total_run"
                                class="form-control" [readonly]="true">
                            <label for="total_run" class="Active">Total Run</label>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-12 px-2">
                        <div class="md-form md-outline">
                            <input formControlName="amount" min="0" type="number" id="amount" name="amount"
                                class="form-control">
                            <label for="amount" class="Active">Amount</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 col-md-12 px-2">
                        <div class="md-form md-outline">
                            <input type="time" (change)="onMachineStart($event)" id="machine_start" class="form-control"
                                mdbInput id="machine_Start" name="machine_Start" formControlName="machineStart"
                                [ngClass]="{ 'is-invalid': (submitted && addMachineReading.controls['machineStart'].errors ) || (addMachineReading.controls['machineStart'].errors && addMachineReading.controls['machineStart'].touched)}">
                            <label for="machine_Start" class="Active">Machine Start Time *</label>
                            <code
                                *ngIf="(submitted && addMachineReading.controls['machineStart'].errors ) || (addMachineReading.controls['machineStart'].touched && addMachineReading.controls['machineStart'].invalid)">Machine Start Time is required</code>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-12 px-2">
                        <div class="md-form md-outline">
                            <input type="time" (change)="onMachineStop($event)" id="machine_start" class="form-control" mdbInput
                                id="machine_Stop" name="machine_Stop" formControlName="machineStop"
                                >
                            <label for="machine_Stop" class="Active">Machine Stop Time *</label>
                            
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 col-md-12 px-2">
                        <div class=" md-form md-outline">
                            <input formControlName="extendedTime" type="text" id="time_expend" name="time_expend"
                                class="form-control" [readonly]="true">
                            <label for="time_expend" class="Active">Spent Time</label>
                            <!-- <code *ngIf=" (submitted && addMachineReading.controls['extendedTime'].invalid) || (addMachineReading.controls['extendedTime'].invalid && addMachineReading.controls['extendedTime'].touched)" class="invalid-feedback">Enter Only Numeric Number</code> -->
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-12 px-2">
                        <div class=" md-form md-outline">
                            <select id="vendertype" (change)='VendorfilterSelected($event)' formControlName="vendertype"
                                class="form-control field-ht colorful-select"
                                [ngClass]="{ 'is-invalid': (submitted && addMachineReading.controls['vendertype'].errors ) || (addMachineReading.controls['vendertype'].errors && addMachineReading.controls['vendertype'].touched)}">
                                <option value="">Select Vendor *</option>
                                <option *ngFor="let contractorlist of respcontractor"
                                    value={{contractorlist.contractorId}}>
                                    {{contractorlist.contractorName}}
                                </option>
                            </select>
                            <label class="Active">Vendor/Contractor Name *</label>
                            <code
                                *ngIf="(submitted && addMachineReading.controls['vendertype'].errors ) || (addMachineReading.controls['vendertype'].touched && addMachineReading.controls['vendertype'].invalid)">Vendor Type is Required</code>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 col-md-12 px-2">
                        <div class="md-form md-outline">
                            <select id="vechiceltype" (change)='vechicelfilterSelected($event)'
                                formControlName="vechiceltype" class="form-control field-ht colorful-select">
                                <option value="">Select Vehicle *</option>
                                <option *ngFor="let vechicledata of setvechicalList" value="{{vechicledata.VehicleID}}">
                                    {{vechicledata.VehicleName}}, {{vechicledata.VehicleNo}}</option>
                            </select>
                            <label class="Active">Vehicle Name</label>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-12 px-2">
                        <div class=" md-form md-outline">
                            <input formControlName="vehicle_no" type="text" class="form-control" value="{{vehicleno}}"
                                readonly id="vehicle_no"
                                [ngClass]="{ 'is-invalid': (submitted && addMachineReading.controls['vehicle_no'].invalid ) || (addMachineReading.controls['vehicle_no'].invalid && addMachineReading.controls['vehicle_no'].touched)}">
                            <label for="vehicle_no" class="Active">Vehicle No</label>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-12 px-2" *ngIf="showGatePassField">
                        <div class=" md-form md-outline">
                            <input formControlName="gate_pass_no" type="text" id="gate_pass_no" name="gate_pass_no"
                                class="form-control">
                            <label for="gate_pass_no" class="Active">Gate Pass</label>
                        </div>
                    </div>

                </div>
                <div class="row">
                    <div class="col-lg-12 col-md-12 md-form md-outline px-2">
                        <textarea type="text" id="working_notes" #notes formControlName="notes" name="notes"
                            class="md-textarea form-control" rows="2" 
                            [ngClass]="{ 'is-invalid': (submitted && addMachineReading.controls['notes'].invalid ) || (addMachineReading.controls['notes'].invalid && addMachineReading.controls['notes'].touched)}"></textarea>
                        <label for="working_notes" class="Active">Notes *</label>
                        <div *ngIf=" (submitted && addMachineReading.controls['notes'].invalid) || (addMachineReading.controls['notes'].invalid && addMachineReading.controls['notes'].touched)"
                            class="invalid-feedback">
                            <div
                                *ngIf=" (submitted && addMachineReading.controls['notes'].invalid) || (addMachineReading.controls['notes'].invalid && addMachineReading.controls['notes'].touched)">
                                Notes is required</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <!-- Footer -->
    <div class="modal-footer mx-3 mx-4">
        <button type="button" class="btn btn-sm btn-danger" (click)="modal.dismiss()">Cancel</button>
        <div *ngIf="saveButton1">

            <button type="button" (click)="saveMachineReading()" [disabled]="isButtonDisabled"
                class="btn btn-sm btn-outline-success waves-effect">Save</button>

        </div>
    </div>
</div>
