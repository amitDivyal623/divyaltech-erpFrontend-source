<div class="modal-content">
    <!-- Header -->
    <div class="modal-header mdb-color">
        <p class="heading lead font-weight-bold">Add New Property Booking</p>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true" class="white-text">&times;</span>
        </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
        <div class="row" [formGroup]="taskDetails">
            <div  class="col-lg-8 col-sm-12 mb-4 overflow-auto colheight">
                <div class="form-row mt-4">
                    <h6 class="font-weight-bold ml-2">Task Title</h6>
                </div>
                <div class="form-row mt-2">
                    <input #title (click)="editTaskTitle()"  class="form-control" />
                </div>
                <code *ngIf="taskDetails.controls['title'].touched && taskDetails.controls['title'].invalid">Title is required</code>
                <div  class="form-row d-flex justify-content-start">
                    <button type="button" (click)="saveTaskTitle(taskId)" class="btn btn-sm btn-primary">Save</button>
                    <button type="button" (click)="hideTaskTitleSave()" class="btn btn-sm bg-white text-dark">Cancel</button>
                </div>
                <div class="form-row mt-4">
                    
                    <h6 class="font-weight-bold ml-2">Description</h6>
                </div>
                <div class="form-row mt-2 mb-2">
                    <textarea ngbTooltip="Click to Edit" placement="top"  class="text-justify border-0 form-control" style="min-height: 6rem;"></textarea>
                </div>
                <code >Description is required</code>
                <div class="form-row mt-3 d-flex justify-content-start">
                    <button type="button"  class="btn btn-sm btn-primary">Save</button>
                    <button type="button" class="btn btn-sm bg-white text-dark">Cancel</button>
                </div>
                
            </div>
            <div class="col-lg-4 col-sm-12">
                <div class="card shadow-none">
                    <div class="form-row mb-2 mt-2 ">
                        <h4>Other Information</h4>
                    </div>
                    <div class="form-row">
                        <div class="col-md-12 md-form md-outline">
                            <select formControlName="enquiry_mode" id="enquiry_mode" class="form-control field-ht colorful-select" >
                                <option value="" selected="true" disabled="disabled">Select Status</option>
                                <option value="1">Hold</option>
                                <option value="2">In Progress</option>
                                <option value="3">Pending</option>
                            </select>
                            <label class="ml-2 active">Status</label>
                        </div>
                        <div class="col-md-12 md-form md-outline">
                            <input type="text" formControlName="enquiry_mode" id="enquiry_mode" class="form-control" required="">
                            <label class="ml-2 active">Reporter</label>
                        </div>
                        <div class="col-md-12">
                            <div class="md-form md-outline margin-mdform">
                                <input type="text" formControlName="enquiry_cust" id="enquiry_cust" class="form-control" required="">
                                <label for="enquiry_cust" class="">Assignee</label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="md-form md-outline">
                                <input placeholder="Select date" [minDate]="minDate" readonly ngbDatepicker #edate="ngbDatepicker" (click)="edate.toggle()" type="text" id="Enquiry_date" class="form-control datepicker" >
                                <label for="date-picker-example" class="active">Date*</label>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </div>
            <div class="col-lg-12 col-sm-12">
                <div class="card fill-flex mt-4 mb-3">
                    <div class="card-header bg-white text-dark">
                        <h5>Comments</h5>
                    </div>
                    <div class="card-body mt-3 mx-3">
                        <div class="card card-body mb-3" >
                            <div class="comm">
                                <div class="form-row mt-2 font-weight-bold">
                                    <div class="col"></div>
                                    <div class="col text-right"></div>
                                </div>
                                <div class="form-row">
                                    <textarea #swiper class="mt-2 mx-1 flex-fill text-justify border-0 commentBox"  style="min-height: 5rem;" [readonly]="writeAccess"></textarea>
                                </div>
                                <div>
                                    <div class="form-row d-flex justify-content-start">
                                        <button type="button" id=""  class="showeditButton border-0 bg-white text-primary">Save</button>
                                        <button type="button" id="" class=" border-0 bg-white text-primary">Edit</button>
                                        <button type="button" id=""  class="showeditButton border-0 bg-white text-danger">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="input-group mb-3">
                            <textarea class="form-control"  placeholder="Add your comment"></textarea>
                            <div class="input-group-append">
                                <button id="basic-addon2" class="input-group-text bg-dark text-white">Add</button>
                            </div>

                        </div>
                       
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-danger" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-outline-success waves-effect">Save</button>
    </div>
</div>
