
        <!-- Content -->
        <div class="modal-content">
            <!-- Header -->
            <div class="modal-header mdb-color" style="height: 3rem;">
                <p class="heading lead font-weight-bold" style="color: white;">{{heading}}</p>
                <button type="button" class="close" (click)="modal.dismiss()" aria-label="Close">
                    <span aria-hidden="true" class="white-text">&times;</span>
                </button>
            </div>
            <!-- Body -->
            <form [formGroup]="workDiaryDetails" id="dailyDairy" name="dailyDairy">
                <div class="modal-body">
                    <div class="col-lg-12 col-md-12">
                        <div class="row">
                            <div class="col-lg-6 col-md-12 px-2">
                                <div class="md-form md-outline">
                                    <input type="hidden" name="EntryID" formControlName="EntryID">
                                    <input type="hidden" name="Employee_Type" formControlName="Employee_Type">
                                    <input placeholder="Select date" formControlName="entryDate" name="entryDate" [minDate]="minDate" [maxDate]="maxDate" value="" readonly ngbDatepicker #dateadd="ngbDatepicker" (click)="dateadd.toggle()" type="text"
                                        id="entryDate" class="form-control datepicker" [ngClass]="{ 'is-invalid': (submitted && workDiaryDetails.controls['entryDate'].invalid ) || (workDiaryDetails.controls['entryDate'].invalid && workDiaryDetails.controls['entryDate'].touched)}">
                                    <label for="entryDate" class="active">Date *</label>
                                    <div *ngIf=" (submitted && workDiaryDetails.controls['entryDate'].invalid) || (workDiaryDetails.controls['entryDate'].invalid && workDiaryDetails.controls['entryDate'].touched)" class="invalid-feedback">
                                        <div *ngIf=" (submitted && workDiaryDetails.controls['entryDate'].invalid) || (workDiaryDetails.controls['entryDate'].invalid && workDiaryDetails.controls['entryDate'].touched)">Date is required</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6 col-md-12 md-form md-outline px-2">
                                <select class="form-control field-ht colorful-select" formControlName="projectName" id="projectName" name="projectName" [ngClass]="{ 'is-invalid': (submitted && workDiaryDetails.controls['projectName'].invalid ) || (workDiaryDetails.controls['projectName'].invalid && workDiaryDetails.controls['projectName'].touched)}">
                                    <option value="" selected="true">Select Project Name</option>
                                   <option *ngFor="let projectlist of respProject" value={{projectlist.projectId}}>
                                        {{projectlist.projectName}} / {{projectlist.projectType}}
                                    </option>
                                </select>
                                <label class=" ml-2 active">Project Name *</label>
                                <div *ngIf=" (submitted && workDiaryDetails.controls['projectName'].invalid) || (workDiaryDetails.controls['projectName'].invalid && workDiaryDetails.controls['projectName'].touched)" class="invalid-feedback">
                                    <div *ngIf=" (submitted && workDiaryDetails.controls['projectName'].invalid) || (workDiaryDetails.controls['projectName'].invalid && workDiaryDetails.controls['projectName'].touched)">Project Name is required</div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div *ngIf="EmployeeTypeAccess" class="col-lg-12 col-md-12 md-form md-outline px-2">
                                <select class="form-control field-ht colorful-select" (change)="emlpoyeedata($event)" formControlName="EmployeeType" name="EmployeeType" [ngClass]="{ 'is-invalid': (submitted && workDiaryDetails.controls['EmployeeType'].invalid ) || (workDiaryDetails.controls['EmployeeType'].invalid && workDiaryDetails.controls['EmployeeType'].touched)}">
                                    <option value=""  selected>Select Employee Type</option>
                                    <option *ngFor="let EmployeeTypelist of resplookupEmployeeType" value={{EmployeeTypelist.LookupDataId}}>
                                        {{EmployeeTypelist.LookupValue}}
                                    </option>
                                </select>
                                <label class="ml-2 active">Employee Type </label>
                                <div *ngIf=" (submitted && workDiaryDetails.controls['EmployeeType'].invalid) || (workDiaryDetails.controls['EmployeeType'].invalid && workDiaryDetails.controls['EmployeeType'].touched)" class="invalid-feedback">
                                    <div *ngIf=" (submitted && workDiaryDetails.controls['EmployeeType'].invalid) || (workDiaryDetails.controls['EmployeeType'].invalid && workDiaryDetails.controls['EmployeeType'].touched)">Employee Type is required</div>
                                </div>
                            </div>
                            <div class="col-lg-12 col-md-12 md-form md-outline px-2" *ngIf="tempdiv">
                                <select class="form-control field-ht colorful-select" formControlName="TempEmployeeName" name="TempEmployeeName" [ngClass]="{ 'is-invalid': (submitted && workDiaryDetails.controls['TempEmployeeName'].invalid ) || (workDiaryDetails.controls['TempEmployeeName'].invalid && workDiaryDetails.controls['TempEmployeeName'].touched)}">
                                    <option value="" selected>Select Temporary Employees Name</option>
                                    <option *ngFor="let Employeelist of resptempEmployeeType" value={{Employeelist.EmployeeId}}>
                                        {{Employeelist.EmployeeName}}
                                    </option>
                                </select>
                                <label class="ml-2 active">Temporary Employee Name</label>
                                <div *ngIf=" (submitted && workDiaryDetails.controls['TempEmployeeName'].invalid) || (workDiaryDetails.controls['TempEmployeeName'].invalid && workDiaryDetails.controls['TempEmployeeName'].touched)" class="invalid-feedback">
                                    <div *ngIf=" (submitted && workDiaryDetails.controls['TempEmployeeName'].invalid) || (workDiaryDetails.controls['TempEmployeeName'].invalid && workDiaryDetails.controls['TempEmployeeName'].touched)">Temporary Employee Name is required</div>
                                </div>
                            </div>
                            <div class="col-lg-12 col-md-12 md-form md-outline px-2" *ngIf="Permanentdiv">
                                <select class="form-control field-ht colorful-select" formControlName="EmployeeName" name="EmployeeName" [ngClass]="{ 'is-invalid': (submitted && workDiaryDetails.controls['EmployeeName'].invalid ) || (workDiaryDetails.controls['EmployeeName'].invalid && workDiaryDetails.controls['EmployeeName'].touched)}">
                                    <option value="" selected>Select Permanent Employees Name</option>
                                    <option *ngFor="let EmployeeList of PermanentEmployeeType" value={{EmployeeList.EmployeeId}}>
                                        {{EmployeeList.EmployeeName}}
                                    </option>
                                </select>
                                <label class="ml-2 active">Employee Name</label>
                                <div *ngIf=" (submitted && workDiaryDetails.controls['EmployeeName'].invalid) || (workDiaryDetails.controls['EmployeeName'].invalid && workDiaryDetails.controls['EmployeeName'].touched)" class="invalid-feedback">
                                    <div *ngIf=" (submitted && workDiaryDetails.controls['EmployeeName'].invalid) || (workDiaryDetails.controls['EmployeeName'].invalid && workDiaryDetails.controls['EmployeeName'].touched)">Permanent Employees Name is required</div>
                                </div>
                            </div>
                            <div class="col-lg-12 col-md-12 px-2" *ngIf="labourdiv">
                                <div class="md-form md-outline">
                                    <input type="text" id="project-daily" class="form-control" formControlName="labourName" name="labourName" [ngClass]="{ 'is-invalid': (submitted && workDiaryDetails.controls['labourName'].invalid ) || (workDiaryDetails.controls['labourName'].invalid && workDiaryDetails.controls['labourName'].touched)}">
                                    <label for="project-daily" class="{{classname}}">Labour Name</label>
                                    <div *ngIf=" (submitted && workDiaryDetails.controls['labourName'].invalid) || (workDiaryDetails.controls['labourName'].invalid && workDiaryDetails.controls['labourName'].touched)" class="invalid-feedback">
                                        <div *ngIf=" (submitted && workDiaryDetails.controls['labourName'].invalid) || (workDiaryDetails.controls['labourName'].invalid && workDiaryDetails.controls['labourName'].touched)">Labour Names is required</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6 col-md-12 px-2" *ngIf="labourdiv">
                                <div class="md-form md-outline">
                                    <input type="number" id="project-daily" class="form-control" formControlName="totalLabour" name="totalLabour" [ngClass]="{ 'is-invalid': (submitted && workDiaryDetails.controls['totalLabour'].invalid ) || (workDiaryDetails.controls['totalLabour'].invalid && workDiaryDetails.controls['totalLabour'].touched)}">
                                    <label for="project-daily" class="{{classname}}">Total Labour</label>
                                    <div *ngIf=" (submitted && workDiaryDetails.controls['totalLabour'].invalid) || (workDiaryDetails.controls['totalLabour'].invalid && workDiaryDetails.controls['totalLabour'].touched)" class="invalid-feedback">
                                        <div *ngIf=" (submitted && workDiaryDetails.controls['totalLabour'].invalid) || (workDiaryDetails.controls['totalLabour'].invalid && workDiaryDetails.controls['totalLabour'].touched)">Total Labour is required</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6 col-md-12 md-form md-outline px-2" *ngIf="labourdiv">
                                <select class="form-control field-ht colorful-select" formControlName="ContractorName" name="ContractorName" [ngClass]="{ 'is-invalid': (submitted && workDiaryDetails.controls['ContractorName'].invalid ) || (workDiaryDetails.controls['ContractorName'].invalid && workDiaryDetails.controls['ContractorName'].touched)}">
                                    <option value="" selected>Select Contractor Name</option>
                                    <option *ngFor="let contractorlist of respcontractor" value={{contractorlist.contractorId}}>
                                    {{contractorlist.contractorName}}
                                    </option>
                                </select>
                                <label class="active">Contractor Name</label>
                                <div *ngIf=" (submitted && workDiaryDetails.controls['ContractorName'].invalid) || (workDiaryDetails.controls['ContractorName'].invalid && workDiaryDetails.controls['ContractorName'].touched)" class="invalid-feedback">
                                    <div *ngIf=" (submitted && workDiaryDetails.controls['ContractorName'].invalid) || (workDiaryDetails.controls['ContractorName'].invalid && workDiaryDetails.controls['ContractorName'].touched)">Contractor Name is required</div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-12 col-md-12 md-form md-outline px-2">
                                <textarea type="text" id="working_notes" #notes formControlName="notes" name="notes" class="md-textarea form-control" rows="2" required="" [ngClass]="{ 'is-invalid': (submitted && workDiaryDetails.controls['notes'].invalid ) || (workDiaryDetails.controls['notes'].invalid && workDiaryDetails.controls['notes'].touched)}"></textarea>
                                <label for="working_notes" class="ml-2 {{classname}}">Notes *</label>
                                <div *ngIf=" (submitted && workDiaryDetails.controls['notes'].invalid) || (workDiaryDetails.controls['notes'].invalid && workDiaryDetails.controls['notes'].touched)" class="invalid-feedback">
                                    <div *ngIf=" (submitted && workDiaryDetails.controls['notes'].invalid) || (workDiaryDetails.controls['notes'].invalid && workDiaryDetails.controls['notes'].touched)">Notes is required</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Footer -->
                <div class="modal-footer mx-3 mx-4">
                    <button type="button" class="btn btn-sm btn-danger" #closebutton (click)="modal.dismiss()">Cancel</button>
                    <div *ngIf="saveButton">
                        <button type="button" (click)=onSubmit() [disabled]="isButtonDisabled" class="btn btn-sm btn-outline-success waves-effect">Save</button>
                    </div>
                </div>
            </form>
        </div>
