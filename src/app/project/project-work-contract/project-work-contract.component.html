<body class="fixed-sn white-skin">

    <!-- Main Navigation -->
    <header>

        <!-- Sidebar navigation -->
        <app-header></app-header>

        <!-- Navbar -->
        <app-navbar></app-navbar>

        <!-- /.Navbar -->

    </header>
    <!-- Main Navigation -->

    <!-- Main layout -->
    <main>
        <div class="container-fluid mb-3 px-4">
            <div class="card">
                <h5 class="card-header info-tab white-text pl-4" style="font-weight: 500;">Work Contract
                    <ng-container>
                        <button type="button" class="btn btn-white heavy-rain-gradient btn-sm  waves-light waves-effect float-right my-0" data-toggle="modal" data-target="#add_master_modal" (click)="lookupFormreset()"><i class="fa fa-plus" aria-hidden="true"></i> Add Work Contract</button>
                    </ng-container>
                </h5>
                <div class="card-body" [formGroup] ="searchContract">
                    <div class="form-row">
                        <div class="col-md-3 md-form md-outline px-4">
                            <select class="form-control field-ht colorful-select" id="searchVendorName" formControlName="searchVendorName">
                                <option value="" >Select Vendor name</option>
                                <option *ngFor="let type of respcontractor" value={{type.contractorId}}>
                                    {{type.contractorName}}
                                </option>
                            </select>
                            <label class="top-lb active">Vendor Name</label>
                        </div>
                        <div class="col-md-3 px-4">
                            <div class="md-form md-outline">
                                <input type="text" id="form-projectmanager" class="form-control" formControlName="searchContractCode">
                                <label for="form-projectmanager" class="">Contract Code</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-row float-right mr-3">
                        <button type="button" class="btn dusty-grass-gradient btn-sm  waves-light waves-effect" (click)="searchLists()"  ><i class="fa fa-search mr-2" aria-hidden="true"></i>Search</button>
                        <button type="button" class="btn warm-flame-gradient btn-sm waves-light waves-effect" (click)="resetSearch()"><i class="fas fa-redo-alt mr-2" aria-hidden="true"></i>Reset</button> 
                    </div>
                </div>
            </div>
        </div>
        <div class="container-fluid px-4 my-4">
            <section>
                <div class="card">
                    <div class="table-responsive card-body">
                        <div  class="tab-pane pb-0" id="docsTabsBank" role="tabpanel"  >
                      
                                <div class="form-row px-1">
                                    <!-- <div class="col-md-2 md-form md-outline px-3">                                                                          
                                            <select class="form-control field-ht colorful-select"
                                                formControlName="bd_acc_head"
                                                (click)="onPartyInAccHeadChange($event)">
                                                <option value=""> Select </option>            
                                                <option *ngFor="let bankList of partyInresplookupBank" [value]="bankList.bankCategory">
                                                    {{ bankList.bankCategory }}
                                                </option>
                                            </select>        
                                            <label class="ml-3 active" >Account Head</label>                                                                                
                                    </div> -->

            
                                    <!-- <button type="button" class="btn dusty-grass-gradient btn-sm  waves-light waves-effect" (click)="BankSearch()"><i class="fa fa-search mr-2" aria-hidden="true"></i>Search</button>
                                    <button type="button" class="btn warm-flame-gradient btn-sm waves-light waves-effect" (click)="resetBankSearch()"><i class="fas fa-redo-alt mr-2" aria-hidden="true"></i>Reset</button> -->                               
            
                                </div>

                                <div class="col-md-12 p-2">
                                    <div class="table-responsive card-body">
                                        <table id="buyertable" datatable [dtOptions]="dtOptions"
                                            [dtTrigger]="dtTrigger" class="table table-striped" cellspacing="0"
                                            width="100%">
                                            <thead>
                                                <tr>
                                                    <th>
                                                    </th>
                                                    <th>S.No.
                                                    </th>
                                                    <th> Vendor Name
                                                    </th>
                                                    <th> Contract Code
                                                    </th>
                                                    <th> Contract Description
                                                    </th>
                                                    <th>Action
                                                    </th>
                                                    
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr *ngFor="let item of workContractData;let i=index">
                                                    <td>
                                                    </td>
                                                    <td>{{i+1}}
                                                    </td>
                                                    <td>{{item.vendorName}}
                                                    </td>
                                                    <td>{{item.contract_code}}
                                                    </td>
                                                    <td>{{item.contract_description}}
                                                    </td>
                                                    <td>
                                                        <a class="black-text" id="{{i+1}}" ngbTooltip="View ICM"
                                                            placement="top"
                                                            (click)="ViewContractDetail('View_Contract',item.contract_id)"
                                                            data-toggle="modal" data-target="#add_master_modal"><i
                                                                class="fa fa-eye" aria-hidden="true"></i></a>
                                                        <a class="teal-text" id="{{i+1}}" ngbTooltip="Edit ICM"
                                                            placement="top" data-toggle="modal"
                                                            data-target="#add_master_modal"
                                                            (click)="ViewContractDetail('Edit_Contract',item.contract_id)"><i
                                                                class="fa-pencil-alt px-1 fas"></i></a>
                                                        <a class="red-text" (click)="removeContract(item.contract_id)"
                                                            mdbtooltip="Remove" placement="top"><i
                                                                class="fa-times px-1 fas"></i></a>
                                                    </td>
                                                
                                                    
                                                </tr>
                                            </tbody>
                                            <tbody *ngIf="workContractData?.length == 0">
                                                <tr>
                                                    <td colspan="3" class="no-data-available">
                                                        No
                                                        data!
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            
                        </div>                        
                    </div>
                </div>
            </section>

        </div>

        <!--Starts Work Contract Add modal-->
            <div class="modal fade" id="add_master_modal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-lg modal-notify modal-info" role="document">
                    <!-- Content -->
                    <div class="modal-content">
                        <!-- Header -->
                        <div class="modal-header mdb-color">
                            <p class="heading lead font-weight-bold">Add New Entry</p>
                            <button type="button" #closebutton class="close" data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true" class="white-text">&times;</span>
                            </button>
                        </div>

                        <!-- Body -->
                        <div [formGroup]="addWorkContract" class="modal-body">

                        <input type="hidden" formControlName="vendor_id" />
                        <input type="hidden" formControlName="contract_id" />

                        <div class="form-row">
                            <!-- Vendor Name -->
                            <div class="col md-form md-outline">
                            <select 
                                formControlName="vendor_name"
                                [ngClass]="{'is-invalid': addWorkContract.controls['vendor_name'].touched && addWorkContract.controls['vendor_name'].invalid}"
                                id="vendor_name" 
                                class="form-control field-ht colorful-select">
                                <option value="" disabled selected>Select Vendor Name</option>
                                <option *ngFor="let type of respcontractor" [value]="type.contractorId">{{type.contractorName}}</option>
                            </select>
                            <label class="ml-1 active">Vendor Name</label>
                            <div *ngIf="addWorkContract.controls['vendor_name'].touched && addWorkContract.controls['vendor_name'].invalid" class="invalid-feedback d-block">
                                Vendor Name is required
                            </div>
                            </div>

                            <!-- Contract Code -->
                            <div class="col">
                            <div class="md-form md-outline">
                                <input
                                type="text"
                                formControlName="contract_code"
                                id="contract_code"
                                class="form-control"
                                [ngClass]="{'is-invalid': addWorkContract.controls['contract_code'].touched && addWorkContract.controls['contract_code'].invalid}"
                                />
                                <label  for="contract_code" class="active">Contract Code</label>
                                <div *ngIf="addWorkContract.controls['contract_code'].touched && addWorkContract.controls['contract_code'].invalid" class="invalid-feedback d-block">
                                Contract Code is required 
                                </div>
                            </div>
                            </div>
                        </div>

                        <!-- Contract Description -->
                        <div class="form-row">
                            <div class="col-lg-12 col-md-12 px-2">
                            <div class="md-form md-outline">
                                <textarea
                                formControlName="contract_description"
                                class="md-textarea form-control"
                                rows="2"
                                [ngClass]="{'is-invalid': addWorkContract.controls['contract_description'].touched && addWorkContract.controls['contract_description'].invalid}"
                                ></textarea>
                                <label class="active" for="form10">Contract Description*</label>
                                <div
                                *ngIf="addWorkContract.controls['contract_description'].touched && addWorkContract.controls['contract_description'].invalid"
                                class="invalid-feedback d-block">
                                Description is required 
                                </div>
                            </div>
                            </div>
                        </div>
                        </div>
                        <!-- Footer -->
                        <div class="modal-footer">
                            <button type="button" #closebutton class="btn btn-sm btn-danger" data-dismiss="modal">Cancel</button>
                            <button type="button" (click)="addContractData()" [disabled]="isButtonDisabled" class="btn btn-sm btn-outline-success waves-effect">Save</button>
                        </div>
                    </div>
                    <!-- Content -->
                </div>
            </div>        
        <!-- End Work Contract Add modal-->


    </main>
    <!-- Main layout -->
</body>
