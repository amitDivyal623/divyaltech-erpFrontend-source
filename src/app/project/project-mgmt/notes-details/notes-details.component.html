<div class="row">
    <div class="col-md-12">
        <div class="row">
            <div class="px-2 float-right">
                <button type="button" class="btn btn-elegant btn-sm  waves-light waves-effect form-disable" (click)="Newnotesadd()" ><i class="fa fa-plus" aria-hidden="true"></i> Add New Notes</button>
                <button type="button" style="display: none;" #notesModalButton data-toggle="modal" data-target="#add_notes_modal"></button>
            </div>
        </div>
    </div>
    <!--Grid column: Content-->
    <div class=" col-md-12">
        <div class="card">
            <div class="table-responsive card-body">
                <table id="dt-material-checkbox" datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-striped" cellspacing="0" width="100%">
                    <thead>
                        <tr>
                            <th></th>
                            <th width="10%">S.No.
                            </th>
                            <th width="30%">Date
                            </th>
                            <th width="53%">Detail
                            </th>
                            <th width="7%">Action
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of notesdata;let i=index">
                            <td></td>
                            <td>{{item.counter}}</td>
                            <td>{{item.NotesDate}}</td>
                            <td>{{item.Details}}</td>
                            <td>
                                <a class="green-text" (click)="editNotes(item.notesid)"><i class="fa-pencil-alt px-1 fas"></i></a>
                                <ng-container *ngIf="role.includes('Admin') || role.includes('Project Manager')">
                                    <a class="red-text" mdbtooltip="Remove" (click)="DeleteNotes(item.notesid)" placement="top"><i class="fa-times px-1 fas"></i></a>
                                </ng-container>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <!--Grid column: Content-->
</div>

<!-- Add New notes modal -->
<div class="modal fade" id="add_notes_modal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-notify modal-info" role="document">
        <!-- Content -->
        <div class="modal-content">
            <!-- Header -->
            <div class="modal-header mdb-color">
                <p class="heading lead font-weight-bold">{{notesModalHadding}}</p>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true" class="white-text">&times;</span>
                </button>
            </div>
            <form [formGroup]="noteDetails" id="noteDetails" name="noteDetails">
                <!-- Body -->
                <div class="modal-body">
                    <!-- <div class="form-row">
                        <div class="col">
                            <div class="md-form md-outline">
                                <input placeholder="Selected date" type="text" id="notesDate" formControlName="notesDate" name="notesDate" class="form-control datepicker" [minDate]="minDate" [maxDate]="maxDate"  readonly ngbDatepicker #notesDate="ngbDatepicker" (click)="notesDate.toggle()" [ngClass]="{ 'is-invalid': (notessubmitted && noteDetails.controls['notesDate'].invalid ) || (noteDetails.controls['notesDate'].invalid && noteDetails.controls['notesDate'].touched)}">
                                <label for="notesDate" class="active">Select Date</label>
                                <div *ngIf=" (notessubmitted && noteDetails.controls['notesDate'].invalid) || (noteDetails.controls['notesDate'].invalid && noteDetails.controls['notesDate'].touched)" class="invalid-feedback" >Date required</div>
                            </div>
                        </div>
                    </div> -->
                    <div class="form-row">
                        <div class="col">
                            <div class="md-form md-outline">
                                <input type="hidden" name="notes_id" formControlName="notes_id">
                                <textarea type="text" id="form10" class="md-textarea form-control" formControlName="noteDetail" name="noteDetail" rows="3" required="" [ngClass]="{ 'is-invalid': (notessubmitted && noteDetails.controls['noteDetail'].invalid ) || (noteDetails.controls['noteDetail'].invalid && noteDetails.controls['noteDetail'].touched)}"></textarea>
                                <label for="form10">Detail</label>
                                <div *ngIf=" (notessubmitted && noteDetails.controls['noteDetail'].invalid) || (noteDetails.controls['noteDetail'].invalid && noteDetails.controls['noteDetail'].touched)" class="invalid-feedback" >Details is required</div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-danger" #notesclosebutton data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-sm btn-outline-success form-disable waves-effect" (click)="noteSubmit()" id="save_country">Save</button>
                </div>
            </form>

        </div>
        <!-- Content -->
    </div>
</div>
