<body class="fixed-sn white-skin">

    <!-- Main Navigation -->
    <header>

        <!-- Sidebar navigation -->
        <app-header></app-header>

        <!-- Navbar -->
        <app-navbar></app-navbar>

        <!-- /.Navbar -->

    </header>
    <!-- Main Navigation -->

    <!-- Main layout -->
    <main>
        <div class="container-fluid mb-3 px-4">
            <div class="card">
                <h5 class="card-header info-tab white-text pl-4" style="font-weight: 500;">Labour Report</h5>
                <div class="col-lg-12 col-md-12" [formGroup]="labourReport">
                    <div class="row py-2 px-2">
                        <div class="col-md-2 px-2">
                            <div class="md-form md-outline pr-2">
                                <input placeholder="Select date" formControlName="dateFrom" [minDate]="minDate" [maxDate]="maxDate" readonly ngbDatepicker #fromdate="ngbDatepicker" (click)="fromdate.toggle()" type="text" id="dateFrom" class="form-control datepicker">
                                <label for="dateFrom" class="active">Date From</label>
                            </div>
                        </div>
                        <div class="col-md-2 px-2">
                            <div class="md-form md-outline pr-2">
                                <input placeholder="Select date" formControlName="dateTo" [minDate]="minDate" [maxDate]="maxDate" readonly ngbDatepicker #todate="ngbDatepicker" (click)="todate.toggle()" type="text" id="dateTo" class="form-control datepicker">
                                <label for="dateTo" class="active">Date To</label>
                            </div>
                        </div>
                       
                        <div class="col-md-3 md-form md-outline px-4">
                            <select class="form-control field-ht colorful-select" id="ResourceType" formControlName="vendorName">
                                <option value=""  selected>Select Vendor Name</option>
                                <option *ngFor="let vendorlist of vendorDataList" value={{vendorlist.VendorId}}>
                                    {{vendorlist.VendorName}}
                                </option>
                            </select>

                            <label class="top-lb active">Vendor Name</label>
                        </div>
                        <div class="col-md-3 md-form md-outline px-4">
                            <select class="form-control field-ht colorful-select" id="ResourceType" formControlName="projectName">
                                <option value=""  selected>Select Project Name</option>
                                <option *ngFor="let projectlist of respProject" value={{projectlist.projectId}}>
                                    {{projectlist.projectName}}  /  {{projectlist.projectType}}
                                </option>
                            </select>
                            <label class="top-lb active">Project Name</label>
                        </div>

                        <div class="form-row float-right mr-3">
                            <button type="button" class="float-right btn dusty-grass-gradient btn-sm  waves-light waves-effect" (click)="showData()"><i class="fa fa-search mr-2" aria-hidden="true"></i>Search</button>
                           
                                <button type="button"  class="btn warm-flame-gradient btn-sm waves-light waves-effect float-right" (click)="downloadfile()"><i class="fa fa-refresh" aria-hidden="true"></i>Export</button>
                        </div>
                        
                    </div>
                </div> 
            </div>
        </div>
         <div class="container-fluid px-4 mb-2">
            <div class="card px-2 my-2">
                <form>
                    <div class="table-responsive">
						<div style="margin-left:75%;">
						</div>
                          
                        <table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" id="dt-material-checkbox" class="table table-striped" cellspacing="0" width="100%">
                            <thead class="winter-neva-gradient">
                                <tr>
                                    
                                    <th >S.No.</th>
                                    
                                    <th >Vendor Name</th>
                                    <th >ProjectName</th>
                                    <th >Entry Date</th>
                                    <th >project Description</th>
                                    <th >Total Labour</th>
                                    <th >Labour Name</th>
                                    <th style="text-align: center;">Details Description </th>
                                
                                    
                                    
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of data;let i=index">
                                    
                                    <td style="width: 5%">{{i+1}}</td>
                                    <td style="width: 10%" >{{item.VendorName}}</td>
                                    <td style="width: 10%">{{item.projectName}}</td>
                                    <td style="width: 10%">{{item.entryDate}}</td>
                                    <td style="width: 15%">{{item.projectDescription}}</td>
                                    <td style="width: 8%">{{item.Totallabour}}</td>
                                    <td style="width: 15%">{{item.LabourName}}</td>
                                    <td style="width: 20%">{{item.details}}</td>
                                    
                                
                                   
                                </tr>
                            </tbody>
                         
                        </table>
                    </div>
                </form>
                
            </div>
        </div> 
      
    </main> 
</body>
