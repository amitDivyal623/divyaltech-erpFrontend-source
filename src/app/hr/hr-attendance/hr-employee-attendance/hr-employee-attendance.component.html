<body class="fixed-sn white-skin">
    <!-- Main Navigation -->
    <header>

        <!-- Sidebar navigation -->
        <app-header></app-header>

        <!-- Navbar -->
        <app-navbar></app-navbar>

        <!-- /.Navbar -->

    </header>
    <!-- Main Navigation -->

    <!-- Main layout -->
    <main>
        <div class="container-fluid mb-3 px-4">
            <div class="card">
                <h5 class="card-header info-tab white-text pl-4" style="font-weight: 500;">Employee Attendence</h5>
                <div class="col-lg-12 col-md-12" [formGroup]="searchAttandence">
                    <div class="row py-2 px-2">
                        <div class="col-md-2 px-2">
                            <div class="md-form md-outline">
                                <input type="text" id="salary-month" class="form-control" formControlName="month">
                                <label for="salary-month" class="active">Month</label>
                            </div>
                        </div>
                        <div class="col-md-2 px-2">
                            <div class="md-form md-outline">
                                <input type="text" id="salary-year" class="form-control" formControlName="year">
                                <label for="salary-year" class="active">Enter Year</label>
                            </div>
                        </div>
                        <div class="col-md-3 md-form md-outline px-4">
                            <select class="form-control field-ht colorful-select" id="form-customername" formControlName="employee">
                                <option value="" selected="true">Select Employee Name</option>
                                <option *ngFor="let Employeelist of employee" value={{Employeelist.EmployeeId}}>
                                    {{Employeelist.EmployeeName}}
                                </option>
                            </select>
                            <label class="top-lb active">Employee</label>
                        </div>
                        <div class="col-md-5 px-2 float-right">
                            <button type="button" (click)="searching()" class="float-right btn dusty-grass-gradient btn-sm  waves-light waves-effect"><i class="fa fa-search mr-2" aria-hidden="true"></i>Search</button>
                        </div>
                    </div>
                </div> 
            </div>
        </div>
        <div class="container-fluid  px-4 my-4">
            <section>
                <div class="card ">
                    <div class="table-responsive">
                        <table id="attandancetable" datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger"  class="table table-striped" cellspacing="0" width="100%">
                            <thead class="winter-neva-gradient">
                                <tr>
                                    <th width="10%">S.No.</th>
                                    <th width="15%">Month/Year</th>
                                    <th width="25%">Emp Id</th>
                                    <th width="20%">Employee Name</th>
                                    <th width="10%">Total days</th>
                                    <th width="20%">Present days</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of dataa;let i=index">
                                    <td>{{item.counter}}</td>
                                    <td>{{item.montyear}}</td>
                                    <td>{{item.EmployeeId}}</td>
                                    <td>{{item.EmployeeName}}</td>
                                    <td>{{item.TotalDayOfMonth}}</td>
                                    <td><input type="text" id="" value="{{item.attt}}" class=fill-input></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
