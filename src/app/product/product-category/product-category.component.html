<div class="row">
	<div class="col-lg-12 col-md-12 px-2">
		<div class="row py-2 px-2" >
			<div class="col-md-4 px-4" [formGroup]="SearchProdCategory">
				<div class=" md-form md-outline">
					<input type="text" id="search-prodcategory"  class="form-control" formControlName="SearchCateforyName" name="SearchCateforyName">
					<label for="search-prodcategory" class="">Product Category Name</label>
				</div>
			</div>
			<div class="col-md-2 px-2 mt-2 float-right">
				<button class="btn btn-white heavy-rain-gradient btn-sm  waves-light waves-effect float-right my-0" (click)="SearchCetgory()"><i class="fa fa-search mr-2" aria-hidden="true"></i>Search</button>
			</div>
			<div class="col-lg-4 col-md-12 mt-2 px-2">
				<button type="button" class="btn btn-white heavy-rain-gradient btn-sm  waves-light waves-effect float-right my-0" (click)="AddProdCategory()"><i class="fa fa-plus" aria-hidden="true"></i> Add New Product Category</button>
				<button type="button" style="display: none;" data-toggle="modal" data-target="#add_prod_category" #modalbutton ></button>
			</div>
		</div>
	</div>
	<div class="col-lg-12 col-md-12 px-0">
		<div class="container-fluid my-3">
			<section>
				<div class="card">
					<div class="table-responsive card-body">
						<table id="dt-material-checkbox" datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-striped" cellspacing="0" width="100%">
							<thead>
								<tr>
									<th></th>
									<th>Product Category Code
									</th>
									<th>Product Category Name
									</th>
									<th>Product Sub Category Name
									</th>
									<th>Status
									</th>
									<th>Action
									</th>
								</tr>
							</thead>
							<tbody>
								<tr *ngFor="let item of data;let i=index">
									<td></td>
									<td>{{item.productCategoryCode}}</td>
									<td>{{item.productCategoryName}}</td>
									<td>{{item.productSubCategoryName}}</td>
									<td>{{item.status}}</td>
									<td>
										<a class="black-text" mdbtooltip="View" (click)="viewCategory(item.productCategoryId)" placement="top" ><i class="fa fa-eye" aria-hidden="true"></i></a>
										<a class="teal-text" mdbtooltip="Edit" (click)="editCategory(item.productCategoryId)" placement="top" ><i class="fa-pencil-alt px-1 fas"></i></a>
										<a class="red-text" mdbtooltip="Remove" (click)="deleteCategory(item.productCategoryId)" placement="top"><i class="fa-times px-1 fas"></i></a>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</section>
			<!-- Add New property sale modal -->
			<div class="modal fade" id="add_prod_category" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
				<div class="modal-dialog modal-lg modal-notify modal-info" role="document">
					<!-- Content -->
					<div class="modal-content">
						<!-- Header -->
						<div class="modal-header mdb-color">
							<p class="heading lead font-weight-bold">Add New Product Field</p>
							<button type="button" class="close" data-dismiss="modal" aria-label="Close">
								<span aria-hidden="true" class="white-text">&times;</span>
							</button>
						</div>
						<!-- Body -->
						<form [formGroup]="ProdCategoryForm">
							<div class="modal-body">
								<div class="form-row">
									<div class="col-lg-6 col-md-12 px-2">
										<div class=" md-form md-outline">
											<input type="hidden" id="prodCategoryCodeid" name="prodCategoryCodeid" formControlName="prodCategoryCodeid">
											<input type="text" id="prod-category" class="form-control" name="prodCategoryCode" formControlName="prodCategoryCode" [ngClass]="{ 'is-invalid': (submitted && ProdCategoryForm.controls['prodCategoryCode'].invalid ) || (ProdCategoryForm.controls['prodCategoryCode'].invalid && ProdCategoryForm.controls['prodCategoryCode'].touched)}">
											<label for="prod-category" class="{{activefiled}}">Product Category Code</label>
											<!-- <div *ngIf=" (submitted && ProdCategoryForm.controls['prodCategoryCode'].invalid) || (ProdCategoryForm.controls['prodCategoryCode'].invalid && ProdCategoryForm.controls['prodCategoryCode'].touched)"
												class="invalid-feedback">Please Enter Parent GST Code</div> -->
										</div>
									</div>
									<div class="col-lg-6 col-md-12 px-2">
										<div class=" md-form md-outline">
											<input type="text" id="pcategory-name" class="form-control" name="prodCategoryName" formControlName="prodCategoryName" [ngClass]="{ 'is-invalid': (submitted && ProdCategoryForm.controls['prodCategoryName'].invalid ) || (ProdCategoryForm.controls['prodCategoryName'].invalid && ProdCategoryForm.controls['prodCategoryName'].touched)}">
											<label for="pcategory-name" class="{{activefiled}}">Product Category Name</label>
											<div *ngIf=" (submitted && ProdCategoryForm.controls['prodCategoryName'].invalid) || (ProdCategoryForm.controls['prodCategoryName'].invalid && ProdCategoryForm.controls['prodCategoryName'].touched)"
												class="invalid-feedback">Please Enter Product Category Name</div>
											
										</div>
									</div>
									<div class="col-lg-6 col-md-12 px-2">
										<div class=" md-form md-outline">
											<input type="text" id="category-subname" class="form-control" formControlName="prodSubCategory" [ngClass]="{ 'is-invalid': (submitted && ProdCategoryForm.controls['prodSubCategory'].invalid ) || (ProdCategoryForm.controls['prodSubCategory'].invalid && ProdCategoryForm.controls['prodSubCategory'].touched)}">
											<label for="category-subname" class="{{activefiled}}">Product Sub Category Name</label>
											<!-- <div *ngIf=" (submitted && ProdCategoryForm.controls['prodSubCategory'].invalid) || (ProdCategoryForm.controls['prodSubCategory'].invalid && ProdCategoryForm.controls['prodSubCategory'].touched)"
												class="invalid-feedback">Please Enter Parent GST Code</div> -->
										</div>
									</div>
									<div class="col-lg-6 col-md-12 px-2">
										<div class="md-form md-outline">
											<input class="form-check-input filled-in" type="checkbox" value="" id="prodCategorystatus" formControlName="prodCategorystatus" name="prodCategorystatus">
												<label class="form-check-label" for="prodCategorystatus">Enabled?</label>
										</div>
									</div>
								</div>
							</div>
						</form>
						<!-- Footer -->
						<div class="modal-footer mx-3">
							<a type="button" class="btn btn-sm btn-danger" #closebutton data-dismiss="modal">Cancel</a>
							<span *ngIf="save_btn">
								<a *ngIf="cateGoryiewTAb" type="button" class="btn btn-sm btn-outline-success waves-effect" (click)="saveProdCategory()">Save</a>
							</span>
						</div>
					</div>
					<!-- Content -->
				</div>
			</div>
		</div>
	</div>
</div>
