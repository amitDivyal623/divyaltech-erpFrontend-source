<body class="fixed-sn white-skin">

    <!-- Main Navigation -->
    <header>

        <!-- Sidebar navigation -->
        <app-header></app-header>

        <!-- Navbar -->
        <app-navbar></app-navbar>

        <!-- /.Navbar -->

    </header>
    <!-- Main Navigation -->

    <!-- Main layout -->
    <main>
        <div class="container-fluid px-4 mb-2">
            <div class="card">
                <h5 class="card-header info-tab white-text pl-4 py-2" style="font-weight: 500;">Document Followup
                    <button type="button" class="btn btn-white heavy-rain-gradient btn-sm  waves-light waves-effect float-right my-0" (click)="openmodal()" ><i class="fa fa-plus" aria-hidden="true"></i> Add New Task</button>
                    <button type="button" style="display: none;" #taskaddModel data-toggle="modal" data-target="#add_task_modal"></button>
                    <!-- <button type="button" style="display: none;" #taskEditModel data-toggle="modal" data-target="#editTask"></button> -->
                </h5>
                <div [formGroup]="followUp" class="card-body">
                    <div class="form-row">
                        <!-- <div class="col-md-3 md-form md-outline px-4">
                            <select formControlName="customerName" class="form-control field-ht colorful-select" id="form-customername">
                                <option value="" selected="true">Select Assignee</option>
                                <option *ngFor="let Employeelist of employee" value={{Employeelist.EmployeeId}}>
                                    {{Employeelist.EmployeeName}}
                                </option>
                            </select>
                            <label class="top-lb active">Assignee</label>
                        </div> -->
                        <!-- <div class="col-md-3 md-form md-outline px-4">
                            <select formControlName="userName" class="form-control field-ht colorful-select" id="form-username">
                                <option value="" selected="true">Select Reporter</option>
                                <option *ngFor="let Employeelist of employee" value={{Employeelist.EmployeeId}}>
                                    {{Employeelist.EmployeeName}}
                                </option>
                            </select>
                            <label class="top-lb active">Reporter</label>
                        </div> -->
                        <div class="col-md-3 px-4">
                            <div class=" md-form md-outline">
                                <input formControlName="userName" name="user_task" type="text" id="userName" class="form-control">
                                <label for="userName" class="">Customer name*</label>
                            </div>
                        </div>
                        <div class="col-md-2 px-2">
                            <div class="md-form md-outline pr-2">
                                <input placeholder="Select date" formControlName="dateFrom" [minDate]="minDate" [maxDate]="maxDate" readonly ngbDatepicker #fromdate="ngbDatepicker" (click)="fromdate.toggle()" type="text" id="dateFrom" class="form-control datepicker">
                                <label for="dateFrom" class="active">Date From</label>
                            </div>
                        </div>
                        <div class="col-md-2 px-2">
                            <div class="md-form md-outline pr-2">
                                <input placeholder="Select date" formControlName="dateTo" [minDate]="minDate" [maxDate]="maxDate" readonly ngbDatepicker #todate="ngbDatepicker" (click)="todate.toggle()" type="text" id="dateTo" class="form-control datepicker">
                                <label for="dateTo" class="active">Date To</label>
                            </div>
                        </div>
                        <div class="col-md-3 md-form md-outline px-4">
                            <select class="form-control field-ht colorful-select" id="ResourceType" formControlName="task_status">
                                <option value=""  selected>Select status</option>
                                <option *ngFor="let status of respStatus" value="{{status.LookupDataId}}">
                                   {{status.LookupValue}}
                                </option>
                            </select>

                            <label class="top-lb active">Status</label>
                        </div>
                        <div class="col-md-3 md-form md-outline px-4">
                            <select class="form-control field-ht colorful-select" id="ResourceType" formControlName="Tasktagid">
                                <option value=" "  selected>Select Tag</option>
                                <option *ngFor="let Tag of respcusTags" value="{{Tag.id}}">
                                   {{Tag.name}}
                                </option>
                            </select>

                            <label class="top-lb active">Tags</label>
                        </div>

                    </div>
                    <div class="form-row float-right mr-3">
                        <button type="button"  class="btn warm-flame-gradient btn-sm waves-light waves-effect float-right" ><i class="fas fa-redo-alt mr-2" aria-hidden="true"></i>Reset</button>
                        <button type="button"  class="btn dusty-grass-gradient btn-sm  waves-light waves-effect" ><i class="fa fa-search mr-2" aria-hidden="true"></i>Search</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="container-fluid px-4 mb-2">
            <div class="card px-2 my-2">
                <form>
                    <div class="table-responsive">
						<div style="margin-left:75%;">
						</div>
                          
                        <table datatable id="dt-material-checkbox" class="table table-striped" cellspacing="0" width="100%">
                            <thead class="winter-neva-gradient">
                                <tr>
                                    
                                    <th >S.No.</th>
                                    
                                    <th >??</th>  
                                    <th >??</th>
                                    <th >??</th>
                                    <th >??</th>
                                    <th >??</th>
                                    <th >??</th>
                                    <th style="text-align: center;"> </th>
                                
                                    
                                    
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of data;let i=index">
                                    
                                    <td style="width: 5%"></td>
                                    <td style="width: 10%" ></td>
                                    <td style="width: 10%"></td>
                                    <td style="width: 10%"></td>
                                    <td style="width: 15%"></td>
                                    <td style="width: 8%"></td>
                                    <td style="width: 15%">}</td>
                                    <td style="width: 20%"></td>
                                    
                                
                                   
                                </tr>
                            </tbody>
                         
                        </table>
                    </div>
                </form>
                
            </div>
        </div> 
      
    
    
    </main>
    <!-- Main layout -->

</body>
