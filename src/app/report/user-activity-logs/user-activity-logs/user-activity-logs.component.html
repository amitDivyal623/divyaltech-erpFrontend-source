<body class="fixed-sn white-skin">

    <header>
        <app-header></app-header>
        <app-navbar></app-navbar>
    </header>

    <main>
        <div class="container-fluid px-4">
            <div class="card p-3">

                <h5 class="card-header info-tab white-text">User Activity Logs</h5>

            </div>
        </div>

        <div class="container-fluid px-4 my-4">
            <section>
                <div class="card">
                    <div class="table-responsive card-body">
                        <div class="tab-pane pb-0" id="docsTabsBank" role="tabpanel">

                            <div class="form-row px-1">

                            </div>

                            <div class="col-md-12 p-2">
                                <div class="table-responsive card-body">
                                    <table id="buyertable" datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger"
                                        class="table table-striped" cellspacing="0" width="100%">
                                        <thead>
                                            <tr>
                                                <th style="width:1%;">
                                                </th>
                                                <th style="width:2%;">S.No.
                                                </th>
                                                <th style="width:8%;">User Name
                                                </th>
                                                <th style="width:4%;"> Activity Type
                                                </th>
                                                <th style="width:4%;"> Module Name
                                                </th>
                                                <th style="width:4%;"> Action Performed
                                                </th>
                                                <th style="width:4%;"> Activity Date
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr *ngFor="let item of activityTableData;let i=index">
                                                <td>
                                                </td>
                                                <td>{{i+1}}
                                                </td>
                                                <td>{{item.user_name}}
                                                </td>
                                                <td>{{item.activity_type}}
                                                </td>
                                                <td>{{item.module_name}}
                                                </td>
                                                <td>{{item.action_performed}}
                                                </td>
                                                <td>{{item.activity_time | date:'d MMM, y h:mm a'}}
                                                </td>

                                            </tr>
                                        </tbody>
                                        <tbody *ngIf="activityTableData?.length == 0">
                                            <tr>
                                                <td colspan="3" class="no-data-available">
                                                    No
                                                    data!
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

</body>
