<body class="fixed-sn white-skin">

    <!-- Main Navigation -->
    <header>

        <!-- Sidebar navigation -->
        <app-header></app-header>

        <!-- Navbar -->
        <app-navbar></app-navbar>

        <!-- /.Navbar -->

    </header>
    <!-- Main Navigation -->

    <!-- Main layout -->
    <main>
        <div class="container-fluid my-3 px-4">
            <div class="card">
                <h5 class="card-header info-tab white-text pl-4" style="font-weight: 500;">Attendance Report Filter</h5>
                <div class="card-body">
                    <div class="form-row">
                        <div class="col-md-3 md-form md-outline px-4">
                            <select class="form-control field-ht colorful-select">
                                    <option value="" selected="true" disabled="disabled">Select Month</option>
                                    <option value="1">January</option>
                                    <option value="2">Febuary</option>
                                    <option value="3">March</option>
                                    <option value="4">April</option>
                                    <option value="5">May</option>
                                    <option value="5">June</option>
                                    <option value="5">July</option>
                                    <option value="5">August</option>
                                    <option value="5">September</option>
                                    <option value="5">October</option>
                                    <option value="5">November</option>
                                    <option value="5">December</option>
                                </select>
                            <label class="top-lb active">Month</label>
                        </div>
                        <div class="col-md-3 md-form md-outline px-4">
                            <select class="form-control field-ht colorful-select">
                              <option value="" selected="true" disabled="disabled">Select Employee Type</option>
                              <option value="1">Employee1</option>
                              <option value="2">Employee2</option>
                              <option value="3">Employee3</option>
                              <option value="4">Employee4</option>
                              <option value="5">Employee5</option>
                            </select>
                            <label class="top-lb active">Employee Type</label>
                        </div>
                        <div class="col px-4 my-3">
                            <button type="button" class="btn dusty-grass-gradient btn-sm  waves-light waves-effect float-right" data-toggle="modal" data-target="#add_emp_modal"><i class="fa fa-search mr-2" aria-hidden="true"></i>Search</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mx-2">
            <div class="container-fluid my-2 px-0">
                <div class="col-md-12 ">
                    <div id="calendar" class="border_shadow" style="padding-bottom: 1%;"></div>
                </div>
            </div>
        </div>
    </main>
    <!-- Main layout -->
</body>
