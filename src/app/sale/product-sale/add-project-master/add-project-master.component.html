<body class="fixed-sn white-skin">

    <!-- Main Navigation -->
    <header>

        <!-- Sidebar navigation -->
        <app-header></app-header>

        <!-- Navbar -->
        <app-navbar></app-navbar>

        <!-- /.Navbar -->

    </header>
    <!-- Main Navigation -->

    <!-- Main layout -->
    <main>
        <div class="container-fluid px-4 mb-2">
            <div class="card">
                <h5 class="card-header info-tab white-text pl-4" style="font-weight: 500;">Add Product Master</h5>
                <div class="card-body my-3">
                    <div class="row px-3">
                        <div class="col-lg-9 col-md-12 px-2">
                            <div class="border-box mb-4">
                                <span class="border-label">Product Details</span>
                                <div class="row px-3">
                                    <div class="col-lg-6 col-md-12 px-2">
                                        <div class=" md-form md-outline">
                                            <input type="text" id="prod-name" class="form-control">
                                            <label for="prod-name" class="">Product Name</label>
                                        </div>
                                    </div>
                                    <div class="col-lg-3 col-md-12 px-2 md-form md-outline">
                                        <select class="form-control field-ht colorful-select">
                                                <option value="" selected="true" disabled="disabled">Select Classification</option>
                                                <option value="default" >Consumable</option>
                                                <option value="2">Finished goods</option>
                                                <option value="3">Fixed assets</option>
                                                <option value="4">Office equipment</option>
                                                <option value="5">Other</option>
                                            </select>
                                        <label class="ml-2 active">Product Classification</label>
                                    </div>
                                    <div class="col-lg-3 col-md-12 px-2 md-form md-outline">
                                        <select class="form-control field-ht colorful-select">
                                                <option value="" selected="true" disabled="disabled">Select Property type</option>
                                                <option value="default" >Residential</option>
                                                <option value="1">Commercial</option>
                                                <option value="2">Others</option>
                                            </select>
                                        <label class="ml-2 active">Property type</label>
                                    </div>
                                    <div class="col-lg-3 col-md-12 px-2">
                                        <div class=" md-form md-outline">
                                            <input type="text" id="location" class="form-control">
                                            <label for="location" class="">Product Location</label>
                                        </div>
                                    </div>
                                    <div class="col-lg-3 col-md-12 px-2">
                                        <div class=" md-form md-outline">
                                            <input type="text" id="hsn-code" class="form-control">
                                            <label for="hsn-code" class="">HSN Code</label>
                                        </div>
                                    </div>
                                    <div class="col-lg-3 col-md-12 px-2 md-form md-outline">
                                        <select class="form-control field-ht colorful-select">
                                                <option value="" selected="true" disabled="disabled">Select Item Group</option>
                                                <option value="default" >IG1</option>
                                                <option value="1">IG2</option>
                                                <option value="2">IG3</option>
                                        </select>
                                        <label class="ml-2 active">Item Group</label>
                                    </div>
                                    <div class="col-lg-3 col-md-12 px-2">
                                        <div class=" md-form md-outline">
                                            <input type="text" id="prod-size" class="form-control">
                                            <label for="prod-size" class="">Product Size</label>
                                            </div>
                                        </div>
                                    <div class="col-lg-3 col-md-12 px-2">
                                        <div class=" md-form md-outline">
                                            <input type="text" id="prod-col" class="form-control">
                                            <label for="prod-col" class="">Product Color</label>
                                                    </div>
                                                </div>
                                    <div class="col-lg-9 col-md-12 px-2">
                                        <div class="md-form md-outline">
                                            <textarea type="text" id="prod-remark" class="md-textarea form-control" rows="1" required=""></textarea>
                                            <label for="prod-remark">Other details</label>
                                            </div>
                                        </div>
                                    </div>
                            </div>
                        </div>
                        <div class="col-lg-3 col-md-12 px-2 ">
                            <div class="border-box">
                                <span class="border-label">Property Image</span>
                                <div class="col-lg-12 col-md-12">
                                    <div class="group-gap">
                                        <!-- Upload image -->
                                        <div class="avatar-upload">
                                            <div class="avatar-edit">
                                                <input type='file' id="imageUpload" accept=".png, .jpg, .jpeg" #fileInput (change)="uploadFile($event)" />
                                            </div>
                                            <div class="avatar-preview">
                                                <div id="imagePreview" [style.backgroundImage]="'url('+ imageUrl +')'" (click)="fileInput.click()">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-12 col-md-12 px-2 mt-2">
                            <div class="border-box mb-4">
                                <span class="border-label">Property Detail</span>
                                <div class="row px-3">
                                    <div class="col-lg-2 col-md-12 px-2 md-form md-outline">
                                        <select class="form-control field-ht colorful-select">
                                            <option value="" selected="true" disabled="disabled">Select</option>
                                            <option value="default" >Independent house</option>
                                            <option value="2">Land </option>
                                            <option value="3">Office</option>
                                            <option value="4">Apartment</option>
                                            <option value="5">Other</option>
                                        </select>
                                        <label class="ml-2 active">Property Variants</label>
                                    </div>
                                    <div class="col-lg-2 col-md-12 px-2 md-form md-outline">
                                        <select class="form-control field-ht colorful-select">
                                            <option value="" selected="true" disabled="disabled">Select Block</option>
                                            <option value="default" >'A' Block</option>
                                            <option value="2">'B' Block</option>
                                            <option value="3">'C' Block</option>
                                            <option value="4">'D' Block</option>
                                            <option value="5">'E' Block</option>
                                        </select>
                                        <label class="ml-2 active">Block</label>
                                    </div>
                                    <div class="col-lg-2 col-md-12 px-2 md-form md-outline">
                                        <select class="form-control field-ht colorful-select">
                                            <option value="" selected="true" disabled="disabled">Select Floor</option>
                                            <option value="default" >1st</option>
                                            <option value="2">2nd</option>
                                            <option value="3">3rd</option>
                                            <option value="4">4th</option>
                                            <option value="5">5th</option>
                                        </select>
                                        <label class="ml-2 active">Floor</label>
                                    </div>
                                    <div class="col-lg-2 col-md-12 px-2 md-form md-outline">
                                        <select class="form-control field-ht colorful-select">
                                            <option value="" selected="true" disabled="disabled">Select Area</option>
                                            <option value="default" >1BHK</option>
                                            <option value="2">2BHK</option>
                                            <option value="3">3BHK</option>
                                            <option value="4">4BHK</option>
                                            <option value="5">5BHK</option>
                                        </select>
                                        <label class="ml-2 active">BHK</label>
                                    </div>
                                    <div class="col-lg-2 col-md-12 px-2">
                                        <div class=" md-form md-outline">
                                            <input type="text" id="new-qty" class="form-control">
                                            <label for="new-qty" class="">Plot/Flat Number</label>
                                        </div>
                                    </div>
                                    <div class="col-lg-2 col-md-12 px-2 md-form md-outline">
                                        <select class="form-control field-ht colorful-select">
                                            <option value="" selected="true" disabled="disabled">Select Area</option>
                                            <option value="default" >North facing</option>
                                            <option value="2">South facing </option>
                                            <option value="3">East facing</option>
                                            <option value="4">West facing</option>
                                            <option value="5">None</option>
                                        </select>
                                        <label class="ml-2 active">Facing</label>
                                    </div>
                                    <div class="col-lg-2 col-md-12 px-2">
                                        <div class=" md-form md-outline">
                                            <input type="text" id="hsn-code" class="form-control">
                                            <label for="hsn-code" class="">Quantity</label>
                                        </div>
                                    </div>
                                    <div class="col-lg-2 col-md-12 px-2">
                                        <div class="md-form md-outline input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text" id="basic-addon1">Area</span>
                                            </div>
                                            <input type="text" class="form-control" placeholder="Lth" aria-label="Username" aria-describedby="basic-addon1">
                                            <input type="text" class="form-control" placeholder="Bth" aria-label="Username" aria-describedby="basic-addon1">
                                        </div>
                                    </div>
                                    <div class="col-lg-2 col-md-12 px-2">
                                        <div class=" md-form md-outline">
                                            <input type="text" id="plot-area" class="form-control" disabled>
                                            <label for="plot-area" class="">Total Area</label>
                                        </div>
                                    </div>
                                    <div class="col-lg-2 col-md-12 px-2 md-form md-outline">
                                        <select class="form-control field-ht colorful-select">
                                            <option value="" selected="true" disabled="disabled">Select Unit</option>
                                            <option value="default" >Sq.ft</option>
                                            <option value="2">Acres</option>
                                            <option value="3">Yard</option>
                                        </select>
                                        <label class="ml-2 active">Measurement Unit</label>
                                    </div>
                                    <div class="col-lg-2 col-md-12 px-2">
                                        <div class="md-form md-outline input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text" id="basic-addon1">Rs</span>
                                            </div>
                                            <input type="text" class="form-control" placeholder="Rate per Sq.ft." aria-label="Username" aria-describedby="basic-addon1">
                                        </div>
                                    </div>
                                    <div class="col-lg-2 col-md-12 px-2">
                                        <div class="my-2">
                                            <div class="input-group">
                                                <div class="input-group-prepend">
                                                    <div class="input-group-text"><input class="form-check-input filled-in" type="checkbox" value="" id="filledInCheckbox1">
                                                        <label class="form-check-label" for="filledInCheckbox1"></label>
                                                    </div>
                                                </div>
                                                <input type="text" class="form-control" aria-label="Text input with checkbox" placeholder="Diversion" disabled>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 float-right mr-3">
                        <button type="button" class="float-right btn btn-sm dusty-grass-gradient waves-light waves-effect"><i class="fas fa-save mr-2"></i>Submit</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- Main layout -->
</body>
